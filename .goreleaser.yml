version: 2
project_name: radikocast
env:
  - GO111MODULE=on
builds:
  - id: default
    main: ./cmd/radikocast
    binary: radikocast
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

dockers:
  - id: docker-amd64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "maruware/radikocast:{{ .Tag }}-amd64"
    goos: linux
    goarch: amd64
    ids:
      - default

  - id: docker-arm64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "maruware/radikocast:{{ .Tag }}-arm64"
    goos: linux
    goarch: arm64
    ids:
      - default

docker_manifests:
  - name_template: "maruware/radikocast:{{ .Tag }}"
    image_templates:
      - "maruware/radikocast:{{ .Tag }}-amd64"
      - "maruware/radikocast:{{ .Tag }}-arm64"

  - name_template: "maruware/radikocast:latest"
    image_templates:
      - "maruware/radikocast:{{ .Tag }}-amd64"
      - "maruware/radikocast:{{ .Tag }}-arm64"
