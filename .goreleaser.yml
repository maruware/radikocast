version: 2
project_name: radikocast
env:
  - GO111MODULE=on
builds:
  - main: ./cmd/radikocast
    binary: radikocast
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
