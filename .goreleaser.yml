version: 2
project_name: radikocast
env:
  - GO111MODULE=on
builds:
  - id: default
    main: ./cmd/radikocast
    binary: radikocast
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: docker
    dockerfile: Dockerfile.release
    ids:
      - default
    images:
      - "maruware/radikocast"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
